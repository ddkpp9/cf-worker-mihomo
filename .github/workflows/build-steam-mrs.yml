name: Build Steam MRS Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'steam-rules/rules/**'
      - '.github/workflows/build-steam-mrs.yml'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest Mihomo
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_JSON="$(curl -fsSL --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)"

          VERSION="$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')"
          DOWNLOAD_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | test("^mihomo-linux-amd64-v[0-9]+\\.[0-9]+\\.[0-9]+\\.gz$"))
            | .browser_download_url
          ' | head -n 1)"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo 'Unable to determine the latest Mihomo version.'
            exit 1
          fi

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "No matching Linux AMD64 asset found for Mihomo $VERSION."
            exit 1
          fi

          echo "Mihomo version: $VERSION"
          echo "Download URL: $DOWNLOAD_URL"

          curl -fL --retry 3 "$DOWNLOAD_URL" -o mihomo.gz
          gzip -t mihomo.gz
          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Generate MRS
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p steam-rules/ruleset

          ./mihomo convert-ruleset domain text \
            steam-rules/rules/steam-domain.list \
            steam-rules/ruleset/steam-domain.mrs

          ./mihomo convert-ruleset ipcidr text \
            steam-rules/rules/steam-ip.list \
            steam-rules/ruleset/steam-ip.mrs

          test -s steam-rules/ruleset/steam-domain.mrs
          test -s steam-rules/ruleset/steam-ip.mrs
          ls -lh steam-rules/ruleset/

      - name: Commit MRS
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add steam-rules/ruleset/steam-domain.mrs \
                  steam-rules/ruleset/steam-ip.mrs

          if git diff --cached --quiet; then
            echo 'MRS rules have not changed.'
            exit 0
          fi

          git commit -m 'chore: update Steam MRS rules'
          git push
